<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แกลเลอรีภาพ | Gallery — ยี่เป็ง เชียงใหม่</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <canvas id="ambient-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;"></canvas>

  <nav id="navbar" class="scrolled">
    <a class="nav-logo" href="index.html">
      <svg class="nav-logo-icon" viewBox="0 0 36 36" fill="none">
        <ellipse cx="18" cy="14" rx="7" ry="10" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="1.2" /><ellipse cx="18" cy="22" rx="7" ry="2.5" stroke="#F5A623" stroke-width="1" stroke-dasharray="2 2" /><line x1="18" y1="24" x2="18" y2="30" stroke="#F5A623" stroke-width="1" /><ellipse cx="18" cy="24" rx="3" ry="1.2" fill="rgba(255,180,60,0.5)" />
      </svg>
      <span class="nav-logo-text">ยี่เป็ง</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav_home">หน้าแรก</a></li>
      <li><a href="festival.html" data-i18n="nav_festival">เทศกาล</a></li>
      <li><a href="lanterns.html" data-i18n="nav_lanterns">โคมลอย</a></li>
      <li><a href="traditions.html" data-i18n="nav_traditions">ประเพณี</a></li>
      <li><a href="plan.html" data-i18n="nav_plan">วางแผนมา</a></li>
      <li><a href="gallery.html" class="active" data-i18n="nav_gallery">แกลเลอรี</a></li>
    </ul>
    <div class="nav-right"><div class="lang-toggle"><button class="lang-btn" data-lang="th">TH</button><button class="lang-btn" data-lang="en">EN</button></div><button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button></div>
  </nav>

  <main>
    <section id="sec-gallery">
      <div style="padding-top:6rem;min-height:100vh;background:var(--night-sky-2);">
        <div style="max-width:1200px;margin:0 auto;padding:4rem 2rem;">
          <div class="section-header reveal">
            <p class="eyebrow" data-i18n="gal_eyebrow">ภาพถ่าย & ความทรงจำ</p>
            <h1 class="display-md" style="color:#FFFDF5;margin-top:.5rem;" data-i18n="gal_h2">แกลเลอรี</h1>
          </div>

          <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem;">
            <button class="gal-filter-btn btn btn-primary active" data-filter="all" data-i18n="gal_filter_all">ทั้งหมด</button>
            <button class="gal-filter-btn btn btn-outline" data-filter="sky" data-i18n="gal_filter_sky">ท้องฟ้า</button>
            <button class="gal-filter-btn btn btn-outline" data-filter="river" data-i18n="gal_filter_river">แม่น้ำ</button>
            <button class="gal-filter-btn btn btn-outline" data-filter="temple" data-i18n="gal_filter_temple">วัด</button>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">
            <div class="gal-item reveal" data-cat="sky" style="border-radius:12px;overflow:hidden;aspect-ratio:4/3;"><img src="assets/images/hero.png" style="width:100%;height:100%;object-fit:cover;"></div>
            <div class="gal-item reveal" data-cat="temple" style="border-radius:12px;overflow:hidden;aspect-ratio:4/3;"><img src="assets/images/temple.png" style="width:100%;height:100%;object-fit:cover;"></div>
            <div class="gal-item reveal" data-cat="river" style="border-radius:12px;overflow:hidden;aspect-ratio:4/3;"><img src="assets/images/krathong.png" style="width:100%;height:100%;object-fit:cover;"></div>
            <div class="gal-item reveal" data-cat="sky" style="border-radius:12px;overflow:hidden;aspect-ratio:4/3;"><img src="assets/images/gallery-crowd.png" style="width:100%;height:100%;object-fit:cover;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="countdown-bar">
    <span class="countdown-label" data-i18n="countdown_label">นับถอยหลังสู่คืนยี่เป็ง</span>
    <div class="countdown-units">
      <div class="countdown-unit"><span class="countdown-num" id="cd-days">--</span><span class="countdown-sub" data-i18n="cd_days">วัน</span></div>
      <span class="countdown-sep">:</span>
      <div class="countdown-unit"><span class="countdown-num" id="cd-hours">--</span><span class="countdown-sub" data-i18n="cd_hours">ชม.</span></div>
      <span class="countdown-sep">:</span>
      <div class="countdown-unit"><span class="countdown-num" id="cd-mins">--</span><span class="countdown-sub" data-i18n="cd_mins">นาที</span></div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;">
          <svg width="28" height="28" viewBox="0 0 36 36" fill="none"><ellipse cx="18" cy="14" rx="7" ry="10" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="1.2"/><ellipse cx="18" cy="22" rx="7" ry="2.5" stroke="#F5A623" stroke-width="1"/><line x1="18" y1="24" x2="18" y2="30" stroke="#F5A623" stroke-width="1"/></svg>
          <span style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:#FFFDF5;">ยี่เป็ง เชียงใหม่</span>
        </div>
        <p data-i18n="footer_tagline"></p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer_nav_h"></h4>
        <ul>
          <li><a href="index.html" data-i18n="nav_home"></a></li>
          <li><a href="festival.html" data-i18n="nav_festival"></a></li>
          <li><a href="gallery.html" data-i18n="nav_gallery"></a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span data-i18n="footer_copy"></span>
      <span>🏮</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { window.initGallery?.(); window.initReveal?.(); });</script>
</body>
</html>
